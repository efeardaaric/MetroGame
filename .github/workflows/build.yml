name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Simulation & balance tests
        run: timeout 300 godot --headless --path . tests/test_core.tscn
      - name: Localisation keys
        run: python3 tools/check_i18n.py

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup export templates & SDK paths
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          mkdir -p ~/.config/godot
          cp /root/.config/godot/editor_settings-4.tres ~/.config/godot/ || true
      - name: Release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --path . --import || true
          if [ -f release.keystore ]; then
            godot --headless --path . --export-release "Android APK" build/android/RayAgi.apk
          else
            godot --headless --path . --export-debug "Android APK" build/android/RayAgi-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/

  ios:
    name: iOS Xcode project
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          unzip -q godot.zip
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q tpl.tpz -d tpl
          mv tpl/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export Xcode project (unsigned)
        run: |
          G=Godot.app/Contents/MacOS/Godot
          $G --headless --path . --import || true
          sed -i '' 's/application\/export_project_only=false/application\/export_project_only=true/' export_presets.cfg
          mkdir -p build/ios
          $G --headless --path . --export-release "iOS" build/ios/RayAgi.ipa || true
          ls -la build/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/ios/
